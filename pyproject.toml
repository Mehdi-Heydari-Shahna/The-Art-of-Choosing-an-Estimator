[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heros-estimation"
version = "1.0.0"
description = "Heros in Estimation: Kalman and high-gain-observer specialists with a verifying coordinator"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.12", "mpmath>=1.3", "sympy>=1.12", "scikit-learn>=1.4", "matplotlib>=3.8"]

[project.optional-dependencies]
neural = ["torch>=2.2"]
test = ["pytest>=8"]

[project.scripts]
heros = "heros.__main__:main"

[tool.setuptools.packages.find]
include = ["heros*"]
